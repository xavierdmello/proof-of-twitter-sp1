[workspace]
members = [
  "program",
  "script",
]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"

[workspace.dependencies]
actix-cors = "0.7.0"
actix-web = "4.5.1"
base64 = "0.22.1"
hex = "0.4.3"
num-bigint = "0.4.4"
regex = "1.10.4"
rsa = "0.9.6"
serde = "1.0.200"
serde_json = "1.0.116"
sha2 = "0.10.8"
sp1-build = "4.0.0" 
sp1-sdk = "4.0.0"
sp1-lib = "4.0.0"
sp1-zkvm = "4.0.0"
http = "0.2.12"
tokio = "1.37.0"

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", branch = "patch-v0.10.8" }
rsa = { git = "https://github.com/sp1-patches/RustCrypto-RSA/", tag = "patch-0.9.6-sp1-4.0.0" }
